# ─────────────────────────────────────────────────────────────────────────────
# Кофейня целиком: три сервиса + Kafka + по одной базе на сервис.
#
# Запуск:
#   docker compose up -d --build
#   docker compose logs -f order-service
#
# Почему у каждого сервиса своя база, а не три схемы в одном PostgreSQL:
# это не украшение, а условие задачи. Паттерн outbox существует ровно потому,
# что общего источника истины нет и распределённую транзакцию заменить нечем.
# Если посадить сервисы на одну базу, соблазн «ну просто сделать JOIN»
# обнулит весь смысл примера.
# ─────────────────────────────────────────────────────────────────────────────

name: coffeeshop

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - coffee-net

x-postgres-defaults: &postgres-defaults
  image: postgres:17-alpine
  restart: unless-stopped
  environment:
    POSTGRES_USER: &pg-user coffee
    POSTGRES_PASSWORD: &pg-password coffee
  networks:
    - coffee-net
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U coffee -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 5s

services:

  # ── Kafka (KRaft, без ZooKeeper) ───────────────────────────────────────────
  kafka:
    image: apache/kafka:4.2.2
    restart: unless-stopped
    networks:
      - coffee-net
    ports:
      # 29092 — для клиентов с хоста (kafka-ui, kcat, локальные тесты).
      # Внутри сети сервисы ходят на kafka:9092.
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Один брокер: факторы репликации = 1, иначе топики не создадутся
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # Явное создание топика ниже: автосоздание маскирует опечатки в имени
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # ── Создание топика (одноразовый контейнер) ────────────────────────────────
  kafka-init:
    image: apache/kafka:4.2.2
    networks:
      - coffee-net
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists \
          --topic coffee.events \
          --partitions 3 \
          --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --describe --topic coffee.events
    restart: "no"

  # ── Базы: по одной на сервис ───────────────────────────────────────────────
  order-db:
    <<: *postgres-defaults
    environment:
      POSTGRES_DB: coffeeshop_order
      POSTGRES_USER: *pg-user
      POSTGRES_PASSWORD: *pg-password
    ports:
      - "5433:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data

  inventory-db:
    <<: *postgres-defaults
    environment:
      POSTGRES_DB: coffeeshop_inventory
      POSTGRES_USER: *pg-user
      POSTGRES_PASSWORD: *pg-password
    ports:
      - "5434:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql/data

  barista-db:
    <<: *postgres-defaults
    environment:
      POSTGRES_DB: coffeeshop_barista
      POSTGRES_USER: *pg-user
      POSTGRES_PASSWORD: *pg-password
    ports:
      - "5435:5432"
    volumes:
      - barista-db-data:/var/lib/postgresql/data

  # ── Сервисы ────────────────────────────────────────────────────────────────
  #
  # Все три собираются из одного Dockerfile с разным MODULE_PATH.
  # Контекст сборки — корень репозитория (../.. от этого файла).
  #
  order-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: txbox-examples/txbox-coffeeshop-example/docker/Dockerfile
      args:
        MODULE_PATH: txbox-examples/txbox-coffeeshop-example/txbox-coffeeshop-services/txbox-coffeeshop-order-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-db:5432/coffeeshop_order
      SPRING_DATASOURCE_USERNAME: coffee
      SPRING_DATASOURCE_PASSWORD: coffee
      TXBOX_TOPIC: coffee.events
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      order-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  inventory-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: txbox-examples/txbox-coffeeshop-example/docker/Dockerfile
      args:
        MODULE_PATH: txbox-examples/txbox-coffeeshop-example/txbox-coffeeshop-services/txbox-coffeeshop-inventory-service
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/coffeeshop_inventory
      SPRING_DATASOURCE_USERNAME: coffee
      SPRING_DATASOURCE_PASSWORD: coffee
      TXBOX_TOPIC: coffee.events
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      inventory-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  barista-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: txbox-examples/txbox-coffeeshop-example/docker/Dockerfile
      args:
        MODULE_PATH: txbox-examples/txbox-coffeeshop-example/txbox-coffeeshop-services/txbox-coffeeshop-barista-service
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://barista-db:5432/coffeeshop_barista
      SPRING_DATASOURCE_USERNAME: coffee
      SPRING_DATASOURCE_PASSWORD: coffee
      TXBOX_TOPIC: coffee.events
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      barista-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

networks:
  coffee-net:
    driver: bridge

volumes:
  order-db-data:
  inventory-db-data:
  barista-db-data:
