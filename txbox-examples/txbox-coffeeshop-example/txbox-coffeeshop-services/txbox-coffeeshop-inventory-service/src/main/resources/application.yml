spring:
  application:
    name: coffeeshop-inventory
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/coffeeshop_inventory}
    username: ${SPRING_DATASOURCE_USERNAME:coffee}
    password: ${SPRING_DATASOURCE_PASSWORD:coffee}
    hikari:
      pool-name: coffeeshop-inventory-pool
      maximum-pool-size: 10
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# ── txbox ────────────────────────────────────────────────────────────────────
txbox:
  producer:
    enabled: true
    polling:
      interval: 500ms
      batch-size: 100
    kafka:
      # Один топик на все события кофейни.
      #
      # SUFFIX здесь не подходит: он строит имя топика из aggregateType,
      # а у одного сервиса бывает несколько агрегатов (order-service пишет Order,
      # barista — Barista). Получилось бы несколько топиков, а потребитель
      # в этой версии фреймворка слушает ровно один (txbox.consumer.kafka.topic).
      routing: FIXED
      fixed-topic: ${TXBOX_TOPIC:coffee.events}
  consumer:
    kafka:
      topic: ${TXBOX_TOPIC:coffee.events}
      group-id: coffeeshop-inventory
      concurrency: 1
      poll-timeout-ms: 3000
    # Пакет, который сканирует DomainEventScanner.
    # Без него типы событий не найдутся и десериализация упадёт на Object-параметрах.
    domain-event-base-packages:
      - io.coffeeshop.core.event

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    io.txbox: INFO
    io.coffeeshop: INFO
